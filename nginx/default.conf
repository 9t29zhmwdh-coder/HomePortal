server {
    listen 80;
    server_name _;

    # Background uploads are capped at 20 MB by the app; leave room for the form around the file.
    client_max_body_size 21m;

    location / {
        proxy_pass         http://app:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not reach
        # the app, which uses this address for the login lockout.
        proxy_set_header   X-Forwarded-For $remote_addr;
    }
}
