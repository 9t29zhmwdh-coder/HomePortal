name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov httpx
      - name: Install ruff
        run: pip install ruff==0.16.0
      - name: Lint
        run: ruff check --select E9,F821,F822,F823 --output-format=github .
      - name: Format check
        run: ruff format --check .
      - name: Smoke test
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  docker-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare environment
        run: |
          mkdir -p /tmp/homeportal-data
          cp examples/portal.yaml /tmp/homeportal-data/
          cp -r examples/photos /tmp/homeportal-data/
          printf 'DATA_PATH=/tmp/homeportal-data\nTZ=Europe/Zurich\n' > .env
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for portal to become reachable
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost/healthz > /dev/null; then
              echo "Portal is up"
              exit 0
            fi
            sleep 2
          done
          echo "Portal never came up"
          docker compose logs
          exit 1
      - name: Check content through Nginx
        run: |
          set -e
          curl -sf http://localhost/ | grep -q 'href="http://192.168.1.10:5000"'
          curl -sf http://localhost/ | grep -q 'src="/photos/beach-day.jpg"'
          curl -sf -o /dev/null -w '%{content_type}\n' http://localhost/photos/beach-day.jpg | grep -q image/jpeg
          curl -sf http://localhost/static/css/style.css | grep -q link-card
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/photos/..%2Fportal.yaml)" = 404
      - name: Set up, log in and upload through Nginx
        run: |
          set -e
          jar=$(mktemp)
          pw=ci-smoke-password-123
          curl -sf -c "$jar" -o /dev/null -d "password=$pw&confirm=$pw" http://localhost/setup
          csrf=$(curl -sf -b "$jar" http://localhost/settings | grep -o 'name="csrf" value="[^"]*"' | head -1 | cut -d'"' -f4)
          test -n "$csrf"
          # 3 MB of noise: Nginx must pass it on (no 413), the app must refuse it as not an image.
          head -c 3000000 /dev/urandom > big.bin
          location=$(curl -s -b "$jar" -o /dev/null -w '%{redirect_url}' -F "csrf=$csrf" -F "image=@big.bin;type=image/jpeg" http://localhost/settings/uploads)
          echo "$location" | grep -q upload_not_an_image
          curl -sf -b "$jar" -o /dev/null -d "csrf=$csrf&theme=glass&font=nunito&language=de&background=photo:aurora" http://localhost/settings/appearance
          curl -sf http://localhost/ | grep -q 'theme-glass bg-image'
          curl -sf -o /dev/null http://localhost/static/backgrounds/aurora.jpg
      - name: Save a tile layout through Nginx
        run: |
          set -e
          jar=$(mktemp)
          curl -sf -c "$jar" -o /dev/null -d "password=ci-smoke-password-123" http://localhost/login
          csrf=$(curl -sf -b "$jar" http://localhost/settings | grep -o 'name="csrf" value="[^"]*"' | head -1 | cut -d'"' -f4)
          board=$(sudo python3 -c "import json;print(json.load(open('/tmp/homeportal-data/portal.json'))['dashboards'][0]['id'])")
          layout=$(sudo python3 -c "import json;t=json.load(open('/tmp/homeportal-data/portal.json'))['dashboards'][0]['tiles'];print(json.dumps([{'id':x['id'],'x':5-i if x['w']==1 else 0,'y':0 if x['w']==1 else 1,'w':x['w'],'h':x['h']} for i,x in enumerate(t)]))")
          test "$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$layout" http://localhost/edit/$board/layout)" = 403
          curl -sf -b "$jar" -H 'Content-Type: application/json' -H "X-CSRF-Token: $csrf" -d "$layout" http://localhost/edit/$board/layout | grep -q '"ok":true'
          curl -sf http://localhost/ | grep -q -- '--x: 6'
      - name: Data folder holds only what the app wrote
        run: |
          ls -la /tmp/homeportal-data
          test -f /tmp/homeportal-data/portal.json
          sudo grep -q argon2 /tmp/homeportal-data/auth.json
      - name: Login lockout cannot be dodged with a forged X-Forwarded-For
        run: |
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null -H "X-Forwarded-For: 10.0.0.$i" -d "password=wrong" http://localhost/login
          done
          location=$(curl -s -o /dev/null -w '%{redirect_url}' -H "X-Forwarded-For: 10.0.0.99" -d "password=ci-smoke-password-123" http://localhost/login)
          echo "$location" | grep -q login_locked
      - name: Tear down
        if: always()
        run: docker compose down
