services:

  app:
    build: .
    container_name: home-portal
    restart: unless-stopped
    volumes:
      - ${DATA_PATH}:/data
    expose:
      - "8000"
    environment:
      - TZ=${TZ}
      - HOME_PORTAL_SECURE_COOKIES=${HOME_PORTAL_SECURE_COOKIES:-0}
    networks:
      - portal-net

  nginx:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    container_name: home-portal-nginx
    restart: unless-stopped
    ports:
      # BIND_ADDRESS limits the portal to one network interface, for example 192.168.1.10.
      - "${BIND_ADDRESS:-0.0.0.0}:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/realip.d:/etc/nginx/realip.d:ro
    depends_on:
      - app
    networks:
      - portal-net

networks:
  portal-net:
    name: home-portal
