services:

  app:
    build: .
    container_name: home-portal
    restart: unless-stopped
    volumes:
      - ${DATA_PATH}:/data
    expose:
      - "8000"
    environment:
      - TZ=${TZ}
    networks:
      - portal-net

  nginx:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    container_name: home-portal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - portal-net

networks:
  portal-net:
    name: home-portal
