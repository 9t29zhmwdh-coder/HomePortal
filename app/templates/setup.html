{% extends "_base.html" %}
{% block title %}{{ t('setup_title') }}{% endblock %}
{% block body %}
<form class="panel narrow" method="post" action="/setup">
  <h1>{{ t('setup_title') }}</h1>
  <p class="dim">{{ t('setup_intro') }}</p>
  {% if err %}<p class="error">{{ t(err) }}</p>{% endif %}
  <label>{{ t('password') }}<input type="password" name="password" autocomplete="new-password" minlength="10" required autofocus></label>
  <label>{{ t('password_confirm') }}<input type="password" name="confirm" autocomplete="new-password" minlength="10" required></label>
  <button type="submit">{{ t('setup_button') }}</button>
</form>
{% endblock %}
